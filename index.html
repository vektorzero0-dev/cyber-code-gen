<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SYNTAX_FORGE // ZEEO TERMINAL</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <!-- Parser Markdown -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  
  <style>
    html, body {
      font-family: 'Share Tech Mono', 'Fira Code', monospace;
      background-color: #020813;
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      color: #00ff66;
    }

    /* Efek Garis Monitor CRT/Hacker */
    body::before {
      content: " ";
      display: block;
      position: absolute;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
      z-index: 100;
      background-size: 100% 3px, 6px 100%;
      pointer-events: none;
    }

    #ui-wrapper {
      position: relative;
      z-index: 10;
      height: 100vh;
      width: 100%;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    /* --- HACKER GLITCH TITLE (HIJAU + CYAN) --- */
    .hacker-title {
      font-family: 'Share Tech Mono', monospace;
      font-weight: 700;
      text-transform: uppercase;
      position: relative;
      display: inline-block;
      color: #00ff66;
      text-shadow: 0 0 10px rgba(0, 255, 102, 0.8), 0 0 20px rgba(0, 255, 102, 0.4);
      letter-spacing: 2px;
    }

    .hacker-title::before, .hacker-title::after {
      content: attr(data-text);
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    .hacker-title::before {
      left: 2px;
      text-shadow: -2px 0 #00f3ff;
      clip: rect(24px, 550px, 90px, 0);
      animation: glitch-anim-1 2s infinite linear alternate-reverse;
    }

    .hacker-title::after {
      left: -2px;
      text-shadow: -2px 0 #00ff66;
      clip: rect(85px, 550px, 140px, 0);
      animation: glitch-anim-2 2.5s infinite linear alternate-reverse;
    }

    @keyframes glitch-anim-1 {
      0% { clip: rect(10px, 9999px, 85px, 0); transform: skew(0.5deg); }
      20% { clip: rect(65px, 9999px, 15px, 0); transform: skew(-1deg); }
      40% { clip: rect(30px, 9999px, 75px, 0); transform: skew(1deg); }
      60% { clip: rect(90px, 9999px, 5px, 0); transform: skew(-0.5deg); }
      80% { clip: rect(15px, 9999px, 50px, 0); transform: skew(0.8deg); }
      100% { clip: rect(70px, 9999px, 35px, 0); transform: skew(-0.2deg); }
    }

    @keyframes glitch-anim-2 {
      0% { clip: rect(50px, 9999px, 20px, 0); transform: skew(-0.5deg); }
      20% { clip: rect(15px, 9999px, 90px, 0); transform: skew(0.8deg); }
      40% { clip: rect(80px, 9999px, 10px, 0); transform: skew(-1deg); }
      60% { clip-path: inset(10% 0 80% 0); transform: skew(0.3deg); }
      80% { clip: rect(40px, 9999px, 60px, 0); transform: skew(-0.6deg); }
      100% { clip: rect(25px, 9999px, 95px, 0); transform: skew(0.4deg); }
    }

    /* Cyber Boxes */
    .glow-box-cyber { 
      position: relative;
      background: rgba(3, 14, 27, 0.9);
      border: 1px solid rgba(0, 255, 102, 0.3);
      box-shadow: 0 0 15px rgba(0, 255, 102, 0.15), inset 0 0 15px rgba(0, 243, 255, 0.08);
      overflow: hidden;
    }

    /* Canvas Matrix di Dalam Kotak */
    .box-matrix-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
      opacity: 0.25;
    }

    .box-content {
      position: relative;
      z-index: 2;
    }

    .glow-btn-cyber {
      background: linear-gradient(90deg, #00ff66, #00f3ff);
      box-shadow: 0 0 20px rgba(0, 255, 102, 0.4);
      transition: all 0.2s ease;
    }
    .glow-btn-cyber:hover {
      box-shadow: 0 0 30px rgba(0, 255, 102, 0.8), 0 0 15px rgba(0, 243, 255, 0.9);
      transform: translateY(-1px);
    }

    .cyber-card {
      clip-path: polygon(
        0 0, 
        calc(100% - 15px) 0, 
        100% 15px, 
        100% 100%, 
        15px 100%, 
        0 calc(100% - 15px)
      );
    }

    .selectable-text {
      -webkit-user-select: text !important;
      -moz-user-select: text !important;
      user-select: text !important;
    }

    /* Code Container UI */
    .code-container {
      position: relative;
      background-color: #010a14;
      border: 1px solid rgba(0, 255, 102, 0.4);
      border-radius: 4px;
      margin: 12px 0;
      overflow: hidden;
      box-shadow: 0 0 12px rgba(0, 255, 102, 0.15);
    }

    .code-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #041628;
      padding: 6px 12px;
      font-size: 11px;
      border-bottom: 1px solid rgba(0, 255, 102, 0.3);
    }

    .code-container pre {
      margin: 0;
      padding: 12px;
      overflow-x: auto;
      color: #00ff66;
      font-size: 11px;
      line-height: 1.5;
    }

    .markdown-body p { margin-bottom: 8px; color: #67e8f9; }
    .markdown-body ul, .markdown-body ol { margin-left: 20px; list-style-type: disc; color: #86efac; }
    .markdown-body h1, .markdown-body h2, .markdown-body h3 { font-weight: bold; color: #00ff66; margin-top: 10px; }

    #ui-wrapper::-webkit-scrollbar { width: 4px; }
    #ui-wrapper::-webkit-scrollbar-thumb { background: #00ff66; border-radius: 2px; }
  </style>
</head>
<body>

  <div id="ui-wrapper">
    <div class="min-h-screen flex flex-col p-4 sm:p-6 w-full max-w-xl mx-auto justify-between">
      
      <!-- Header Hacker Mode -->
      <header class="w-full border-b border-emerald-500/50 pb-3 mb-4 flex justify-between items-center backdrop-blur-md bg-slate-950/90 p-3 rounded-lg border-l-4 border-l-emerald-400 select-none">
        <div class="flex items-center gap-2">
          <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-ping"></span>
          <div class="flex flex-col">
            <h1 class="text-lg sm:text-xl tracking-wider">
              <span class="hacker-title" data-text="SYNTAX_FORGE">SYNTAX_FORGE</span>
            </h1>
            <span class="text-[9px] text-emerald-400 tracking-widest -mt-1 font-bold">TERMINAL // AI_CORE v6.0</span>
          </div>
        </div>
        <span class="text-[10px] border border-emerald-400/60 px-2 py-0.5 rounded bg-emerald-950/80 text-emerald-300 tracking-widest font-bold animate-pulse">
          ROOT_ACCESS
        </span>
      </header>

      <!-- Main Section -->
      <main class="w-full space-y-4 flex-1">
        
        <!-- Input Terminal -->
        <div class="glow-box-cyber p-3.5 backdrop-blur-md cyber-card relative">
          <canvas class="box-matrix-canvas" id="canvasInput"></canvas>
          <div class="box-content">
            <div class="absolute top-0 right-0 w-3 h-3 border-t-2 border-r-2 border-emerald-400"></div>
            <label class="block text-xs font-semibold text-emerald-400 mb-2 flex justify-between tracking-wider select-none">
              <span class="text-emerald-300 font-bold flex items-center gap-1">&gt;_ INPUT_PAYLOAD</span>
              <span class="text-cyan-400 text-[10px]">GEMINI_ENGINE</span>
            </label>
            <textarea id="prompt" rows="4" placeholder="// Enter code prompt (e.g., generate PHP login script)..." 
              class="w-full bg-black/90 border border-emerald-900/80 rounded p-2.5 text-xs text-emerald-300 focus:outline-none focus:border-emerald-400 focus:ring-1 focus:ring-emerald-400 font-mono resize-none leading-relaxed placeholder-emerald-800 selectable-text"></textarea>
          </div>
        </div>

        <!-- Tombol Execute -->
        <button onclick="generateCode()" id="btnGenerate" 
          class="w-full py-3.5 glow-btn-cyber text-slate-950 font-black text-xs tracking-widest active:scale-95 uppercase cyber-card select-none">
          &gt;&gt; EXECUTE_FORGE &lt;&lt;
        </button>

        <!-- Output Container -->
        <div class="glow-box-cyber p-3.5 backdrop-blur-md cyber-card relative">
          <canvas class="box-matrix-canvas" id="canvasOutput"></canvas>
          <div class="box-content">
            <div class="absolute bottom-0 left-0 w-3 h-3 border-b-2 border-l-2 border-cyan-400"></div>
            <div class="flex justify-between items-center mb-2 pb-1.5 border-b border-emerald-900/60 select-none">
              <span class="text-xs font-bold text-emerald-400 tracking-wider flex items-center gap-1">[02] FORGED_OUTPUT</span>
            </div>
            
            <div id="output" class="text-[11px] font-mono min-h-[120px] max-h-[400px] overflow-y-auto leading-relaxed selectable-text markdown-body">
              <p class="text-emerald-700">// System idle. Waiting for payload execution...</p>
            </div>
          </div>
        </div>

      </main>

      <!-- Footer -->
      <footer class="w-full mt-6 pt-3 border-t border-emerald-500/30 text-center text-[10px] text-emerald-600 space-y-1 bg-slate-950/90 p-2 rounded-lg border-b-2 border-b-emerald-500/50 select-none">
        <p class="font-bold tracking-widest text-emerald-400">
          SYSTEM_ARCHITECT: <span class="text-cyan-400 font-black tracking-widest">ZEEO</span>
        </p>
      </footer>

    </div>
  </div>

  <script>
    /* --- Green Matrix Rain Inside Boxes --- */
    function createBoxMatrix(canvasId) {
      const canvas = document.getElementById(canvasId);
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      let drops = [];
      const fontSize = 14;
      const chars = '01ABCDEFGHJKMNPQRSTUVWXYZ日ﾊﾐﾋｰｳｼﾅﾓﾆｻﾜﾂｵﾘｱﾎﾃﾏｹﾒｴｶｷﾑﾕﾗｾﾈｽﾀﾇﾍ';

      function resize() {
        const rect = canvas.parentElement.getBoundingClientRect();
        canvas.width = rect.width;
        canvas.height = rect.height;
        const columns = Math.floor(canvas.width / fontSize);
        drops = [];
        for (let i = 0; i < columns; i++) { drops[i] = Math.floor(Math.random() * -20); }
      }

      function draw() {
        ctx.fillStyle = 'rgba(2, 8, 19, 0.15)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#00ff66';
        ctx.font = 'bold ' + fontSize + 'px monospace';
        for (let i = 0; i < drops.length; i++) {
          const text = chars.charAt(Math.floor(Math.random() * chars.length));
          const x = i * fontSize;
          const y = drops[i] * fontSize;
          ctx.fillText(text, x, y);
          if (y > canvas.height && Math.random() > 0.96) { drops[i] = 0; }
          drops[i]++;
        }
        requestAnimationFrame(draw);
      }

      resize();
      draw();
      window.addEventListener('resize', resize);
    }

    createBoxMatrix('canvasInput');
    createBoxMatrix('canvasOutput');

    /* --- Request Handler --- */
    async function generateCode() {
      const prompt = document.getElementById('prompt').value.trim();
      const output = document.getElementById('output');
      const btn = document.getElementById('btnGenerate');

      if (!prompt) {
        output.innerHTML = '<p class="text-red-400">// ERROR: Prompt payload is empty!</p>';
        return;
      }

      document.activeElement.blur();
      btn.disabled = true;
      btn.innerText = 'EXECUTING_PAYLOAD...';
      output.innerHTML = '<p class="text-emerald-400 animate-pulse">&gt; COMPILING_SOURCE_CODE...</p>';

      try {
        const endpoint = window.location.hostname.includes('vercel.app') 
          ? '/api/generate' 
          : 'https://cyber-code-gen.vercel.app/api/generate';

        const response = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt })
        });

        const data = await response.json();

        if (data.error) {
          output.innerHTML = `<p class="text-red-400">// BACKEND_ERROR: ${data.error}</p>`;
        } else if (data.candidates && data.candidates[0].content.parts[0].text) {
          const rawText = data.candidates[0].content.parts[0].text;
          renderResponse(rawText);
        } else {
          output.innerHTML = '<p class="text-red-400">// ERROR: Invalid response format.</p>';
        }
      } catch (err) {
        output.innerHTML = `<p class="text-red-400">// NETWORK_ERROR: ${err.message}</p>`;
      } finally {
        btn.disabled = false;
        btn.innerText = '>> EXECUTE_FORGE <<';
      }
    }

    /* --- Render Markdown Response + Copy Button --- */
    function renderResponse(text) {
      const output = document.getElementById('output');
      output.innerHTML = marked.parse(text);

      const codeBlocks = output.querySelectorAll('pre');
      codeBlocks.forEach((pre) => {
        const codeElement = pre.querySelector('code');
        const codeText = codeElement ? codeElement.innerText : pre.innerText;
        
        const langClass = codeElement ? Array.from(codeElement.classList).find(c => c.startsWith('language-')) : '';
        const langName = langClass ? langClass.replace('language-', '').toUpperCase() : 'SOURCE_CODE';

        const container = document.createElement('div');
        container.className = 'code-container';

        const header = document.createElement('div');
        header.className = 'code-header select-none';
        header.innerHTML = `
          <span class="font-bold text-emerald-400">${langName}</span>
          <button onclick="copySpecificCode(this)" class="bg-emerald-950 hover:bg-emerald-900 text-emerald-300 border border-emerald-500/50 px-2.5 py-1 rounded text-[10px] font-bold transition active:scale-95">
            [COPY_CODE]
          </button>
        `;

        pre.parentNode.insertBefore(container, pre);
        container.appendChild(header);
        container.appendChild(pre);

        header.querySelector('button').dataset.code = codeText;
      });
    }

    function copySpecificCode(button) {
      const codeToCopy = button.dataset.code;
      navigator.clipboard.writeText(codeToCopy).then(() => {
        const originalText = button.innerText;
        button.innerText = '[COPIED!]';
        button.classList.replace('text-emerald-300', 'text-cyan-300');
        setTimeout(() => {
          button.innerText = originalText;
          button.classList.replace('text-cyan-300', 'text-emerald-300');
        }, 2000);
      });
    }
  </script>
</body>
</html>
