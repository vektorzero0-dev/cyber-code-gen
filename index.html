<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SYNTAX_FORGE // ZEEO FULLSTACK</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&family=Syncopate:wght@700;800&display=swap" rel="stylesheet">
  <!-- Parser Markdown -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  
  <style>
    html, body {
      font-family: 'Fira Code', monospace;
      background-color: #030712;
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
    }

    #ui-wrapper {
      position: relative;
      z-index: 10;
      height: 100vh;
      width: 100%;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    /* --- ANIMASI NEON GRADIENT FLOW --- */
    @keyframes neonFlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* --- REAL CYBERPUNK GLITCH EFFECT --- */
    .glitch-title {
      font-family: 'Syncopate', sans-serif;
      font-weight: 800;
      text-transform: uppercase;
      position: relative;
      display: inline-block;
      background: linear-gradient(90deg, #06b6d4, #ec4899, #a855f7, #06b6d4);
      background-size: 300% 300%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: neonFlow 4s ease infinite;
      filter: drop-shadow(0 0 12px rgba(236, 72, 153, 0.6));
    }

    .glitch-title::before, .glitch-title::after {
      content: attr(data-text);
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0.8;
    }

    .glitch-title::before {
      left: 2px;
      text-shadow: -2px 0 #ec4899;
      clip-path: inset(24% 0 56% 0);
      animation: glitch-anim-1 1.5s infinite linear alternate-reverse;
    }

    .glitch-title::after {
      left: -2px;
      text-shadow: 2px 0 #06b6d4;
      clip-path: inset(54% 0 12% 0);
      animation: glitch-anim-2 2s infinite linear alternate-reverse;
    }

    @keyframes glitch-anim-1 {
      0% { clip-path: inset(40% 0 61% 0); transform: skew(0.3deg); }
      20% { clip-path: inset(92% 0 1% 0); transform: skew(-0.5deg); }
      40% { clip-path: inset(10% 0 86% 0); transform: skew(0.8deg); }
      60% { clip-path: inset(65% 0 20% 0); transform: skew(-0.3deg); }
      80% { clip-path: inset(20% 0 70% 0); transform: skew(0.6deg); }
      100% { clip-path: inset(80% 0 5% 0); transform: skew(-0.2deg); }
    }

    @keyframes glitch-anim-2 {
      0% { clip-path: inset(25% 0 58% 0); transform: skew(-0.8deg); }
      20% { clip-path: inset(70% 0 10% 0); transform: skew(0.4deg); }
      40% { clip-path: inset(5% 0 90% 0); transform: skew(-0.6deg); }
      60% { clip-path: inset(85% 0 2% 0); transform: skew(0.2deg); }
      80% { clip-path: inset(45% 0 40% 0); transform: skew(-0.4deg); }
      100% { clip-path: inset(12% 0 75% 0); transform: skew(0.5deg); }
    }

    /* Cyber Boxes dengan Canvas Inner Background */
    .glow-box-cyber { 
      position: relative;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(6, 182, 212, 0.4);
      box-shadow: 0 0 20px rgba(6, 182, 212, 0.15), inset 0 0 15px rgba(236, 72, 153, 0.1);
      overflow: hidden;
    }

    /* Canvas Matrix didalam Kotak */
    .box-matrix-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
      opacity: 0.25;
    }

    .box-content {
      position: relative;
      z-index: 2;
    }

    .glow-btn-cyber {
      background: linear-gradient(90deg, #06b6d4, #ec4899);
      background-size: 200% 100%;
      box-shadow: 0 0 20px rgba(236, 72, 153, 0.5);
      transition: all 0.3s ease;
    }
    .glow-btn-cyber:hover {
      background-position: 100% 0;
      box-shadow: 0 0 30px rgba(6, 182, 212, 0.8), 0 0 15px rgba(236, 72, 153, 0.8);
      transform: translateY(-1px);
    }

    .cyber-card {
      clip-path: polygon(
        0 0, 
        calc(100% - 15px) 0, 
        100% 15px, 
        100% 100%, 
        15px 100%, 
        0 calc(100% - 15px)
      );
    }

    .selectable-text {
      -webkit-user-select: text !important;
      -moz-user-select: text !important;
      user-select: text !important;
    }

    /* Code Container UI */
    .code-container {
      position: relative;
      background-color: #030712;
      border: 1px solid rgba(236, 72, 153, 0.4);
      border-radius: 6px;
      margin: 12px 0;
      overflow: hidden;
      box-shadow: 0 0 12px rgba(6, 182, 212, 0.15);
    }

    .code-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #0f172a;
      padding: 6px 12px;
      font-size: 11px;
      border-bottom: 1px solid rgba(236, 72, 153, 0.3);
    }

    .code-container pre {
      margin: 0;
      padding: 12px;
      overflow-x: auto;
      color: #34d399;
      font-size: 11px;
      line-height: 1.5;
    }

    .markdown-body p { margin-bottom: 8px; color: #a5f3fc; }
    .markdown-body ul, .markdown-body ol { margin-left: 20px; list-style-type: disc; color: #f472b6; }
    .markdown-body h1, .markdown-body h2, .markdown-body h3 { font-weight: bold; color: #38bdf8; margin-top: 10px; }

    #ui-wrapper::-webkit-scrollbar { width: 4px; }
    #ui-wrapper::-webkit-scrollbar-thumb { background: #ec4899; border-radius: 2px; }
  </style>
</head>
<body class="text-cyan-400">

  <div id="ui-wrapper">
    <div class="min-h-screen flex flex-col p-4 sm:p-6 w-full max-w-xl mx-auto justify-between">
      
      <!-- Header Cyberpunk Dynamic Glitch -->
      <header class="w-full border-b border-pink-500/40 pb-3 mb-4 flex justify-between items-center backdrop-blur-md bg-slate-950/80 p-3 rounded-lg border-l-4 border-l-cyan-400 select-none">
        <div class="flex items-center gap-2">
          <span class="w-2.5 h-2.5 rounded-full bg-cyan-400 animate-ping"></span>
          <div class="flex flex-col">
            <h1 class="text-lg sm:text-xl tracking-wider">
              <span class="glitch-title" data-text="SYNTAX_FORGE">SYNTAX_FORGE</span>
            </h1>
            <span class="text-[9px] text-pink-400 tracking-widest -mt-1 font-bold">CORE // AI_ENGINE v6.0</span>
          </div>
        </div>
        <span class="text-[10px] border border-cyan-400/50 px-2 py-0.5 rounded bg-cyan-950/80 text-cyan-300 tracking-widest font-bold animate-pulse">
          SYS_READY
        </span>
      </header>

      <!-- Main Section -->
      <main class="w-full space-y-4 flex-1">
        
        <!-- Input Terminal (Matrix Efek Didalam Kotak) -->
        <div class="glow-box-cyber p-3.5 backdrop-blur-md cyber-card relative">
          <canvas class="box-matrix-canvas" id="canvasInput"></canvas>
          <div class="box-content">
            <div class="absolute top-0 right-0 w-3 h-3 border-t-2 border-r-2 border-pink-500"></div>
            <label class="block text-xs font-semibold text-cyan-300 mb-2 flex justify-between tracking-wider select-none">
              <span class="text-pink-400 font-bold flex items-center gap-1">&gt;_ INPUT_TERMINAL</span>
              <span class="text-emerald-400 text-[10px]">GEMINI_API</span>
            </label>
            <textarea id="prompt" rows="4" placeholder="// Ketik instruksi pembuatan kode (misal: buat script login PHP)..." 
              class="w-full bg-black/80 border border-cyan-900/60 rounded p-2.5 text-xs text-cyan-200 focus:outline-none focus:border-pink-500 focus:ring-1 focus:ring-pink-500 font-mono resize-none leading-relaxed placeholder-slate-600 selectable-text"></textarea>
          </div>
        </div>

        <!-- Tombol Execute -->
        <button onclick="generateCode()" id="btnGenerate" 
          class="w-full py-3.5 glow-btn-cyber text-slate-950 font-black text-xs tracking-widest active:scale-95 uppercase cyber-card select-none">
          &gt;&gt; FORGE_CODE_NOW &lt;&lt;
        </button>

        <!-- Output Container (Matrix Efek Didalam Kotak) -->
        <div class="glow-box-cyber p-3.5 backdrop-blur-md cyber-card relative">
          <canvas class="box-matrix-canvas" id="canvasOutput"></canvas>
          <div class="box-content">
            <div class="absolute bottom-0 left-0 w-3 h-3 border-b-2 border-l-2 border-cyan-400"></div>
            <div class="flex justify-between items-center mb-2 pb-1.5 border-b border-pink-900/40 select-none">
              <span class="text-xs font-bold text-pink-400 tracking-wider flex items-center gap-1">[02] FORGED_OUTPUT</span>
            </div>
            
            <div id="output" class="text-[11px] font-mono min-h-[120px] max-h-[400px] overflow-y-auto leading-relaxed selectable-text markdown-body">
              <p class="text-slate-500">// System idle. Waiting for prompt input...</p>
            </div>
          </div>
        </div>

      </main>

      <!-- Footer -->
      <footer class="w-full mt-6 pt-3 border-t border-pink-500/20 text-center text-[10px] text-cyan-600 space-y-1 bg-slate-950/80 p-2 rounded-lg border-b-2 border-b-pink-500/40 select-none">
        <p class="font-bold tracking-widest text-cyan-400">
          SYSTEM_ARCHITECT: <span class="text-pink-500 font-black tracking-widest">ZEEO</span>
        </p>
      </footer>

    </div>
  </div>

  <script>
    /* --- Matrix Rain Animation Inside Boxes --- */
    function createBoxMatrix(canvasId) {
      const canvas = document.getElementById(canvasId);
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      let drops = [];
      const fontSize = 14;
      const chars = '01ABCDEFGHJKMNPQRSTUVWXYZ';

      function resize() {
        const rect = canvas.parentElement.getBoundingClientRect();
        canvas.width = rect.width;
        canvas.height = rect.height;
        const columns = Math.floor(canvas.width / fontSize);
        drops = [];
        for (let i = 0; i < columns; i++) { drops[i] = Math.floor(Math.random() * -20); }
      }

      function draw() {
        ctx.fillStyle = 'rgba(15, 23, 42, 0.15)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#06b6d4';
        ctx.font = 'bold ' + fontSize + 'px monospace';
        for (let i = 0; i < drops.length; i++) {
          const text = chars.charAt(Math.floor(Math.random() * chars.length));
          const x = i * fontSize;
          const y = drops[i] * fontSize;
          ctx.fillText(text, x, y);
          if (y > canvas.height && Math.random() > 0.96) { drops[i] = 0; }
          drops[i]++;
        }
        requestAnimationFrame(draw);
      }

      resize();
      draw();
      window.addEventListener('resize', resize);
    }

    // Inisialisasi Matrix di Kotak Input & Output
    createBoxMatrix('canvasInput');
    createBoxMatrix('canvasOutput');

    /* --- Request Handler --- */
    async function generateCode() {
      const prompt = document.getElementById('prompt').value.trim();
      const output = document.getElementById('output');
      const btn = document.getElementById('btnGenerate');

      if (!prompt) {
        output.innerHTML = '<p class="text-red-400">// ERROR: Prompt terminal tidak boleh kosong!</p>';
        return;
      }

      document.activeElement.blur();
      btn.disabled = true;
      btn.innerText = 'PROCESSING_FORGE...';
      output.innerHTML = '<p class="text-pink-400 animate-pulse">&gt; FORGING_SOURCE_CODE...</p>';

      try {
        const endpoint = window.location.hostname.includes('vercel.app') 
          ? '/api/generate' 
          : 'https://cyber-code-gen.vercel.app/api/generate';

        const response = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt })
        });

        const data = await response.json();

        if (data.error) {
          output.innerHTML = `<p class="text-red-400">// BACKEND_ERROR: ${data.error}</p>`;
        } else if (data.candidates && data.candidates[0].content.parts[0].text) {
          const rawText = data.candidates[0].content.parts[0].text;
          renderResponse(rawText);
        } else {
          output.innerHTML = '<p class="text-red-400">// ERROR: Format respon tidak valid.</p>';
        }
      } catch (err) {
        output.innerHTML = `<p class="text-red-400">// NETWORK_ERROR: ${err.message}</p>`;
      } finally {
        btn.disabled = false;
        btn.innerText = '>> FORGE_CODE_NOW <<';
      }
    }

    /* --- Render Markdown Response + Split Copy Button --- */
    function renderResponse(text) {
      const output = document.getElementById('output');
      output.innerHTML = marked.parse(text);

      const codeBlocks = output.querySelectorAll('pre');
      codeBlocks.forEach((pre) => {
        const codeElement = pre.querySelector('code');
        const codeText = codeElement ? codeElement.innerText : pre.innerText;
        
        const langClass = codeElement ? Array.from(codeElement.classList).find(c => c.startsWith('language-')) : '';
        const langName = langClass ? langClass.replace('language-', '').toUpperCase() : 'SOURCE_CODE';

        const container = document.createElement('div');
        container.className = 'code-container';

        const header = document.createElement('div');
        header.className = 'code-header select-none';
        header.innerHTML = `
          <span class="font-bold text-pink-400">${langName}</span>
          <button onclick="copySpecificCode(this)" class="bg-pink-950 hover:bg-pink-900 text-pink-300 border border-pink-500/50 px-2.5 py-1 rounded text-[10px] font-bold transition active:scale-95">
            [COPY_CODE]
          </button>
        `;

        pre.parentNode.insertBefore(container, pre);
        container.appendChild(header);
        container.appendChild(pre);

        header.querySelector('button').dataset.code = codeText;
      });
    }

    function copySpecificCode(button) {
      const codeToCopy = button.dataset.code;
      navigator.clipboard.writeText(codeToCopy).then(() => {
        const originalText = button.innerText;
        button.innerText = '[COPIED!]';
        button.classList.replace('text-pink-300', 'text-cyan-300');
        setTimeout(() => {
          button.innerText = originalText;
          button.classList.replace('text-cyan-300', 'text-pink-300');
        }, 2000);
      });
    }
  </script>
</body>
</html>
