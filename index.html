<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CYBER_GEN // ZEEO FULLSTACK</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    html, body {
      font-family: 'Fira Code', monospace;
      background-color: #020617;
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
    }

    /* Matrix Rain Canvas - Opacity ditingkatkan ke 0.55 */
    #matrixCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      pointer-events: none;
      opacity: 0.55; 
    }

    #ui-wrapper {
      position: relative;
      z-index: 10;
      height: 100vh;
      width: 100%;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    /* Neon Glow Custom */
    .glow-cyan { text-shadow: 0 0 10px rgba(6, 182, 212, 0.8), 0 0 20px rgba(6, 182, 212, 0.4); }
    .glow-emerald { text-shadow: 0 0 10px rgba(16, 185, 129, 0.8); }
    
    .glow-box-cyan { 
      box-shadow: 0 0 15px rgba(6, 182, 212, 0.25), inset 0 0 15px rgba(6, 182, 212, 0.1); 
    }
    .glow-btn {
      box-shadow: 0 0 15px rgba(6, 182, 212, 0.4);
    }
    .glow-btn:hover {
      box-shadow: 0 0 25px rgba(6, 182, 212, 0.7);
    }

    /* Cyberpunk Cut Corner Card */
    .cyber-card {
      clip-path: polygon(
        0 0, 
        calc(100% - 15px) 0, 
        100% 15px, 
        100% 100%, 
        15px 100%, 
        0 calc(100% - 15px)
      );
    }

    /* Scrollbar Styling */
    #ui-wrapper::-webkit-scrollbar { width: 4px; }
    #ui-wrapper::-webkit-scrollbar-thumb { background: #06b6d4; border-radius: 2px; }
  </style>
</head>
<body class="text-cyan-400 select-none">

  <canvas id="matrixCanvas"></canvas>

  <div id="ui-wrapper">
    <div class="min-h-screen flex flex-col p-4 sm:p-6 w-full max-w-xl mx-auto justify-between">
      
      <header class="w-full border-b border-cyan-500/40 pb-3 mb-4 flex justify-between items-center backdrop-blur-md bg-slate-950/80 p-3 rounded-lg border-l-2 border-l-cyan-400">
        <div class="flex items-center gap-2">
          <span class="w-2.5 h-2.5 rounded-full bg-cyan-400 animate-ping"></span>
          <h1 class="text-lg sm:text-xl font-bold tracking-wider text-cyan-300 glow-cyan">
            CYBER_GEN<span class="text-xs text-emerald-400 font-normal ml-1">v5.1</span>
          </h1>
        </div>
        <span class="text-[10px] border border-cyan-500/50 px-2 py-0.5 rounded bg-cyan-950/80 text-cyan-300 tracking-widest font-bold">
          SYS_READY
        </span>
      </header>

      <main class="w-full space-y-4 flex-1">
        
        <div class="bg-slate-950/90 border border-cyan-500/40 p-3.5 glow-box-cyan backdrop-blur-md cyber-card relative">
          <div class="absolute top-0 right-0 w-3 h-3 border-t-2 border-r-2 border-cyan-400"></div>
          <label class="block text-xs font-semibold text-cyan-300 mb-2 flex justify-between tracking-wider">
            <span>[01] INPUT_TERMINAL_PROMPT</span>
            <span class="text-emerald-400 text-[10px]">CORE_ENGINE</span>
          </label>
          <textarea id="prompt" rows="5" placeholder="// Ketik perintah koding di sini (misal: buat sistem login PHP)..." 
            class="w-full bg-black/90 border border-cyan-900 rounded p-2.5 text-xs text-cyan-200 focus:outline-none focus:border-cyan-400 focus:ring-1 focus:ring-cyan-400 font-mono resize-none leading-relaxed placeholder-slate-600"></textarea>
        </div>

        <button onclick="generateCode()" id="btnGenerate" 
          class="w-full py-3.5 bg-cyan-600 hover:bg-cyan-500 text-slate-950 font-black text-xs tracking-widest transition-all duration-200 glow-btn active:scale-95 uppercase cyber-card">
          &gt;&gt; EXECUTE_GENERATION &lt;&lt;
        </button>

        <div class="bg-slate-950/95 border border-cyan-500/40 p-3.5 glow-box-cyan backdrop-blur-md cyber-card relative">
          <div class="absolute bottom-0 left-0 w-3 h-3 border-b-2 border-l-2 border-cyan-400"></div>
          <div class="flex justify-between items-center mb-2 pb-1.5 border-b border-cyan-900/80">
            <span class="text-xs font-semibold text-cyan-300 tracking-wider">[02] GENERATED_CODE_OUTPUT</span>
            <button onclick="copyOutput()" class="text-[10px] bg-cyan-950 hover:bg-cyan-900 text-cyan-300 border border-cyan-500/50 px-2 py-0.5 rounded transition font-semibold">
              [COPY_CODE]
            </button>
          </div>
          <pre id="output" class="text-[11px] text-emerald-400 font-mono overflow-x-auto min-h-[120px] max-h-[300px] sm:max-h-[400px] whitespace-pre-wrap break-words leading-relaxed">
// System idle. Waiting for input prompt...
          </pre>
        </div>

      </main>

      <footer class="w-full mt-6 pt-3 border-t border-cyan-500/20 text-center text-[10px] text-cyan-600 space-y-1 bg-slate-950/80 p-2 rounded-lg border-b-2 border-b-cyan-500/40">
        <p class="font-bold tracking-widest text-cyan-400">
          DEV: <span class="text-emerald-400 glow-emerald">ZEEO</span>
        </p>
        <div class="flex justify-center items-center gap-4 text-[9px] text-slate-400">
          <span>EMAIL: vektorzero0@gmail.com</span>
          <span class="text-cyan-700">|</span>
          <span>WA: 082371729760</span>
        </div>
      </footer>

    </div>
  </div>

  <script>
    /* --- Matrix Rain Animation Engine (Android Optimized) --- */
    const canvas = document.getElementById('matrixCanvas');
    const ctx = canvas.getContext('2d');
    let drops = [];
    
    // Ukuran Font Matrix Ditingkatkan ke 22px agar besar & jelas di Android
    const fontSize = 22; 
    const chars = '01ABCDEFGHIJKLMNOPQRSTUVWXYZ日ﾊﾐﾋｰｳｼﾅﾓﾆｻﾜﾂｵﾘｱﾎﾃﾏｹﾒｴｶｷﾑﾕﾗｾﾈｽﾀﾇﾍ';

    function initMatrix() {
      // Mengambil ukuran asli viewport Android
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      
      const columns = Math.floor(canvas.width / fontSize);
      drops = [];
      for (let i = 0; i < columns; i++) {
        drops[i] = Math.floor(Math.random() * -30); 
      }
    }

    function renderMatrix() {
      // Trail fade yang lebih tipis (0.04) agar tulisan tidak cepat hilang di HP
      ctx.fillStyle = 'rgba(2, 6, 23, 0.04)'; 
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Warna Cyan Neon Lebih Terang (#00f3ff)
      ctx.fillStyle = '#00f3ff'; 
      ctx.font = 'bold ' + fontSize + 'px monospace';

      for (let i = 0; i < drops.length; i++) {
        const text = chars.charAt(Math.floor(Math.random() * chars.length));
        const x = i * fontSize;
        const y = drops[i] * fontSize;

        ctx.fillText(text, x, y);

        if (y > canvas.height && Math.random() > 0.975) {
          drops[i] = 0;
        }
        drops[i]++;
      }
      requestAnimationFrame(renderMatrix);
    }

    initMatrix();
    renderMatrix();

    window.addEventListener('resize', initMatrix);

    /* --- Request ke Backend Vercel --- */
    async function generateCode() {
      const prompt = document.getElementById('prompt').value.trim();
      const output = document.getElementById('output');
      const btn = document.getElementById('btnGenerate');

      if (!prompt) {
        output.innerText = '// ERROR: Prompt terminal tidak boleh kosong!';
        output.classList.remove('text-emerald-400');
        output.classList.add('text-red-400');
        return;
      }

      document.activeElement.blur();
      output.classList.remove('text-red-400');
      output.classList.add('text-emerald-400');
      
      btn.disabled = true;
      btn.innerText = 'PROCESSING_DATA...';
      output.innerText = '> INITIALIZING_REQUEST...\n> CONNECTING_TO_GEMINI_BACKEND...\n> GENERATING_SOURCE_CODE...';

      try {
        const response = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt })
        });

        const data = await response.json();
        if (data.candidates && data.candidates[0].content.parts[0].text) {
          output.innerText = data.candidates[0].content.parts[0].text;
        } else {
          output.innerText = '// ERROR: Gagal memproses data. Periksa backend/API key Vercel Anda.';
          output.classList.remove('text-emerald-400');
          output.classList.add('text-red-400');
        }
      } catch (err) {
        output.innerText = '// NETWORK_ERROR: ' + err.message;
        output.classList.remove('text-emerald-400');
        output.classList.add('text-red-400');
      } finally {
        btn.disabled = false;
        btn.innerText = '>> EXECUTE_GENERATION <<';
      }
    }

    function copyOutput() {
      const text = document.getElementById('output').innerText;
      navigator.clipboard.writeText(text).then(() => {
        alert('Kode berhasil disalin ke clipboard!');
      });
    }
  </script>
</body>
</html>
